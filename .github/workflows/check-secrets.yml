name: Check FTP secrets (safe, prints no values)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "server equals 141.136.39.147: $([ "$S" = "141.136.39.147" ] && echo yes || echo NO)"
          echo "username equals u440046634.chessdeploy: $([ "$U" = "u440046634.chessdeploy" ] && echo yes || echo NO)"
          echo "username length: ${#U}"
          echo "password length: ${#P}"
          case "$P" in *[[:space:]]*) echo "password contains whitespace: YES";; *) echo "password contains whitespace: no";; esac
          case "$U" in *[[:space:]]*) echo "username contains whitespace: YES";; *) echo "username contains whitespace: no";; esac
          sudo apt-get -qq install -y lftp >/dev/null 2>&1
          lftp -e "set ftp:ssl-force true; set ssl:verify-certificate no; ls -1 | head -3; bye" -u "$U,$P" "$S" >/tmp/o 2>&1 && echo "FTPS login: OK" || { echo "FTPS login: FAILED"; sed 's/./*/g;q' /dev/null; grep -iE "530|login|incorrect|error" /tmp/o | head -3; }
